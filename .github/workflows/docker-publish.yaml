name: 📦 Docker

# Triggers
on:
  push:
    tags: 
      - 'v*.*.*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7 # https://github.com/actions/checkout
        with:
          fetch-depth: 0

      - name: Generate App Version
        id: version
        run: |
          echo "APP_VERSION=$(git describe --tags --always --dirty)" >> $GITHUB_OUTPUT

      - name: Log in to the Container registry
        uses: docker/login-action@v4 # https://github.com/docker/login-action
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # * Génération des tags Docker *
      # À partir du tag Git "v1.2.3", on génère :
      #   - ghcr.io/org/app:v1.2.3  → version exacte (immuable)
      #   - ghcr.io/org/app:v1.2    → majeur.mineur (reçoit les patchs)
      #   - ghcr.io/org/app:v1      → majeur seul
      #   - ghcr.io/org/app:latest  → dernier build
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6 # https://github.com/docker/metadata-action
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Tag semver complet : v1.2.3
            type=semver,pattern={{version}}
            # Majeur.mineur : v1.2
            type=semver,pattern={{major}}.{{minor}}
            # Majeur seul : v1
            type=semver,pattern={{major}}
            # Latest : toujours sur le dernier tag
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v7 # https://github.com/docker/build-push-action
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.APP_VERSION }}